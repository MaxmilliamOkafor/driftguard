services:
  loop:
    build: .
    image: driftguard:latest
    command: python -m driftguard.monitor
  api:
    image: driftguard:latest
    ports: ["8000:8000"]
    command: uvicorn driftguard.serve:app --host 0.0.0.0 --port 8000
  dashboard:
    image: driftguard:latest
    ports: ["8501:8501"]
    command: streamlit run dashboard/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
